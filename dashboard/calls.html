<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Calls — AMC Sahayak Call Analytics</title>
<link rel="stylesheet" href="assets/app.css" />
</head>
<body data-page="calls" data-title="Calls" data-show-range="false">
<div class="app-shell">
  <div class="body-row">
    <main class="page-content" id="page-content">
      <div class="page-inner">

        <div class="page-header">
          <div>
            <h1>Calls</h1>
            <p>Search and filter every recorded call, then open one for full details.</p>
          </div>
        </div>

        <div class="card">
          <div class="filters">
            <div class="field search">
              <span aria-hidden="true" id="search-icon-slot"></span>
              <input id="search" type="text" placeholder="Search by name, phone or area…" aria-label="Search by name, phone number or area" />
            </div>
            <select id="category-filter" aria-label="Filter by complaint category"><option value="">All categories</option></select>
            <select id="status-filter" aria-label="Filter by complaint status">
              <option value="">All calls</option>
              <option value="registered">Complaint registered</option>
              <option value="pending">Not registered</option>
              <option value="missed">Missed</option>
            </select>
          </div>
          <div class="table-scroll">
            <table>
              <thead>
                <tr>
                  <th>Call date/time</th>
                  <th>Phone</th>
                  <th>Caller</th>
                  <th>Area</th>
                  <th>Category</th>
                  <th>Complaints</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody id="calls-tbody"></tbody>
            </table>
          </div>
          <div class="empty-state" id="empty-state" style="display:none;">
            <span id="empty-icon-slot"></span>
            <div>No calls match these filters.</div>
          </div>
        </div>


      </div>
    </main>
  </div>
</div>

<script src="calls_data.js"></script>
<script src="assets/dashboard-lib.js"></script>
<script src="assets/layout.js"></script>
<script>
(function () {
  const lib = window.DashboardLib;
  const data = (typeof CALLS_DATA !== "undefined") ? CALLS_DATA : [];

  document.getElementById("search-icon-slot").outerHTML = lib.ICONS.search;
  document.getElementById("empty-icon-slot").outerHTML = lib.ICONS.search;

  lib.populateCategoryFilter("category-filter", data);

  const searchParams = new URLSearchParams(window.location.search);
  const initialStatus = searchParams.get("status");
  const isFollowUpView = searchParams.get("view") === "followup";

  if (isFollowUpView) {
    document.getElementById("status-filter").value = "missed";
  } else if (initialStatus === "missed" || initialStatus === "registered" || initialStatus === "pending") {
    document.getElementById("status-filter").value = initialStatus;
  }

  if (isFollowUpView) {
    document.title = "Follow-up — AMC Sahayak Call Analytics";
    const h1 = document.querySelector(".page-header h1");
    if (h1) h1.textContent = "Follow-up";
    const subtitle = document.querySelector(".page-header p");
    if (subtitle) subtitle.textContent = "Missed calls that need a follow-up.";
    document.getElementById("status-filter").style.display = "none";
  }

  function detailsUrlFor(r) {
    return "call.html?id=" + encodeURIComponent(r.id);
  }

  function applyFilters() {
    const q = document.getElementById("search").value.trim().toLowerCase();
    const category = document.getElementById("category-filter").value;
    const status = document.getElementById("status-filter").value;

    let rows = data.filter(r => {
      if (q) {
        const hay = `${r.caller_name || ""} ${r.phone || ""} ${r.area || ""} ${r.location || ""}`.toLowerCase();
        if (!hay.includes(q)) return false;
      }
      if (category && !lib.categoriesOf(r).includes(category)) return false;
      if (status === "registered" && !r.complaint_registered) return false;
      if (status === "pending" && (r.complaint_registered || r.call_status === "missed")) return false;
      if (status === "missed" && r.call_status !== "missed") return false;
      return true;
    });
    lib.renderTable("calls-tbody", "empty-state", lib.sortByNewest(rows), detailsUrlFor);
  }

  document.getElementById("search").addEventListener("input", applyFilters);
  document.getElementById("category-filter").addEventListener("change", applyFilters);
  document.getElementById("status-filter").addEventListener("change", applyFilters);

  applyFilters();
})();
</script>
</body>
</html>
