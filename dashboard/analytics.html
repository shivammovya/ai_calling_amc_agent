<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Analytics — AMC Sahayak Call Analytics</title>
<link rel="stylesheet" href="assets/app.css" />
</head>
<body data-page="analytics" data-title="Analytics" data-show-range="false">
<div class="app-shell">
  <div class="body-row">
    <main class="page-content" id="page-content">
      <div class="page-inner">

        <div class="page-header">
          <div>
            <h1>Analytics</h1>
            <p>Citizen complaints by category and area, and how reliably the agent registers them, across all recorded calls.</p>
          </div>
        </div>

        <div class="kpi-row" id="kpi-row"></div>

        <div class="chart-row">
          <div class="card">
            <h2>Complaints by category</h2>
            <div id="category-chart"></div>
          </div>
          <div class="card">
            <h2>Complaint registration</h2>
            <div class="outcome-pct" id="outcome-pct">—</div>
            <div class="outcome-bar" id="outcome-bar"></div>
            <div class="legend">
              <span><span class="swatch" style="background:var(--status-good)"></span>Registered</span>
              <span><span class="swatch" style="background:var(--muted)"></span>Not registered</span>
            </div>
          </div>
        </div>

        <div class="chart-row">
          <div class="card">
            <h2>Complaints by area</h2>
            <div id="area-chart"></div>
          </div>
          <div class="card">
            <h2>Caller name captured</h2>
            <div class="outcome-pct" id="name-pct">—</div>
            <div class="outcome-bar" id="name-bar"></div>
            <div class="legend">
              <span><span class="swatch" style="background:var(--status-good)"></span>Name given</span>
              <span><span class="swatch" style="background:var(--muted)"></span>Declined / not asked</span>
            </div>
          </div>
        </div>


      </div>
    </main>
  </div>
</div>

<script src="calls_data.js"></script>
<script src="assets/dashboard-lib.js"></script>
<script src="assets/layout.js"></script>
<script>
(function () {
  const lib = window.DashboardLib;
  const data = (typeof CALLS_DATA !== "undefined") ? CALLS_DATA : [];

  lib.renderKPIs("kpi-row", data);
  lib.renderCategoryChart("category-chart", data);
  lib.renderOutcome("outcome-pct", "outcome-bar", data);
  lib.renderAreaChart("area-chart", data);
  const answered = data.filter(r => r.call_status !== "missed");
  lib.renderSplit("name-pct", "name-bar", answered, r => !!r.caller_name, "Name given", "Declined / not asked");
})();
</script>
</body>
</html>
